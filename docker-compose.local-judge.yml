# Local-only rehearsal for running SandboxRunner from the API container.
# Never use this Docker socket mount on a server; production uses DevOps' rootless daemon via DOCKER_HOST.
services:
  api:
    # Docker Desktop exposes the socket as root:root (0660); keep the API uid
    # non-root but grant the owning group only in this local test override.
    group_add:
      - '0'
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
