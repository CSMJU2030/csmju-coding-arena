# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-coding-arena          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3209
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/problems
  not_found: /api/v1/problems/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/problems/not-a-uuid
  create:
    path: /api/v1/problems
    allowed_role: lecturer
    denied_role: guest
    invalid_body:
      title: ""
    valid_body:
      title: "Conformance sample"
      description: "Read two integers and output their sum."
      timeLimitMs: 1000
      isActive: true

owners:
  pl: "@csmju2030/pl-coding-arena"
  aie: "@csmju2030/aie-coding-arena"

display_name: "Coding Arena"
repo: github.com/CSMJU2030/csmju-coding-arena
status: proposed

# Provisional components: the official UI template could not be accessed.
local_components:
  - CodeEditor
  - LoadingState
  - EmptyState
  - ErrorState
  - Notice
  - FieldError
